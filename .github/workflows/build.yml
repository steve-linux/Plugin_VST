name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            install: INSTALLA_WINDOWS.txt
          - name: macOS
            os: macos-latest
            install: INSTALLA_MAC.txt
          - name: Linux
            os: ubuntu-24.04
            install: INSTALLA_LINUX.txt

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          OUT="ChannelStrip-${{ matrix.name }}"
          mkdir -p "$OUT"
          ART=build/ChannelStrip_artefacts/Release
          cp -R "$ART/VST3/Channel Strip.vst3" "$OUT/"
          cp -R "$ART/CLAP/Channel Strip.clap" "$OUT/"
          if [ -d "$ART/AU" ]; then cp -R "$ART/AU/Channel Strip.component" "$OUT/"; fi
          cp "packaging/${{ matrix.install }}" "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: ChannelStrip-${{ matrix.name }}
          path: ChannelStrip-${{ matrix.name }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip
        run: |
          cd dist
          for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
